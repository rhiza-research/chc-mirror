# Every 2 hours by default.
schedule: "0 */2 * * *"

# One-shot Job after install and upgrade so new/changed subfolders sync immediately.
initialJob:
  enabled: true

# Paths under https://data.chc.ucsb.edu/ to mirror, in order.
# Each entry needs `path`; optional `accept` is passed to wget -A on the spider
# pass (comma-separated extensions/patterns, e.g. "tif,nc" or "*.tif,*.nc").
# Download uses -nH -P <mirror> so objects land at <mirror>/<url-path>/.
# Example:
#   subfolders:
#     - path: products/CHIRPS-2.0
#       accept: "tif,nc"
#     - path: products/CHIRPS-2.0/docs
subfolders: []

wget:
  baseUrl: https://data.chc.ucsb.edu
  # Recursive spider (no download); -A comes from each subfolder.accept.
  spiderArgs:
    - "--spider"
    - "-r"
    - "-l"
    - "inf"
    - "--no-parent"
    - "-nH"
    - "-e"
    - "robots=off"
    - "--reject"
    - "index.html*"
  # Fetch URL list from spider; -i / -P are set in the job script.
  # -x forces URL path directories (needed for -i; without it files land flat in -P).
  # -nH drops the hostname directory so paths stay under <mirror>/<url-path>/.
  downloadArgs:
    - "-N"
    - "-nH"
    - "-x"
    - "-e"
    - "robots=off"

image:
  repository: alpine
  tag: "3.21"
  pullPolicy: IfNotPresent

imagePullSecrets: []

gcs:
  bucket: sheerwater-public-datalake
  mountPath: /mnt/sheerwater-public-datalake
  # Objects land at gs://<bucket>/<mirrorPrefix>/<subfolder>/ (wget creates the subfolder).
  mirrorPrefix: chc-mirror
  driver: gcsfuse.csi.storage.gke.io
  mountOptions: "implicit-dirs"
  volumeAttributes: {}
  sidecar:
    cpuLimit: ""
    memoryLimit: ""
    ephemeralStorageLimit: ""

serviceAccount:
  create: true
  name: chc-mirror
  # Set Workload Identity binding, e.g.:
  #   iam.gke.io/gcp-service-account: chc-mirror@PROJECT.iam.gserviceaccount.com
  annotations: {}

concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 3
startingDeadlineSeconds: 300
backoffLimit: 1
# 1h50m — leave headroom before the next 2-hour Cron tick.
activeDeadlineSeconds: 6600

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

nameOverride: ""
fullnameOverride: ""
