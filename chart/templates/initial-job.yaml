{{- if .Values.initialJob.enabled }}
{{- if not .Values.subfolders }}
{{- fail "subfolders is required: set at least one CHC subfolder to mirror" }}
{{- end }}
# One-shot run after install and upgrade (e.g. when subfolders change).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chc-mirror.fullname" . }}-initial
  labels:
    {{- include "chc-mirror.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "chc-mirror.jobSpec" . | nindent 2 }}
{{- end }}
